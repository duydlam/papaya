services:
  api:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in the VPS .env}-api:${IMAGE_TAG:-latest}
    env_file: apps/api/.env
    ports: ['127.0.0.1:3001:3001']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in the VPS .env}-web:${IMAGE_TAG:-latest}
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      - api
    restart: unless-stopped
