services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-papaya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-papaya}
      POSTGRES_DB: ${POSTGRES_DB:-papaya}
    ports: ['127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER:-papaya} -d $${POSTGRES_DB:-papaya}',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:${REDIS_HOST_PORT:-6379}:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
